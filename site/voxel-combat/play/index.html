<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Combat Revolved · Play</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #aaa; font: 14px monospace; overflow: hidden; }
  #back { position: fixed; top: 8px; left: 12px; color: #888; text-decoration: none; z-index: 10; }
  #back:hover { color: #fff; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
</style>
</head>
<body>
<canvas tabindex="0"></canvas>
<a id="back" href="../">← back</a>
<div id="loading">Loading…</div>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("voxel.wasm"), go.importObject)
    .then(r => {
      // The game sets up its WebGL context on the canvas once main() runs; drop the loading text then.
      requestAnimationFrame(() => document.getElementById("loading").remove());
      go.run(r.instance);
    })
    .catch(e => { document.getElementById("loading").textContent = "Failed to load: " + e; });
</script>
</body>
</html>
