<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BattleTrail · Play</title>
<style>
  html, body { margin: 0; background: #1e1e1e; color: #ddd; font: 14px helvetica, arial, sans-serif; }
  #back { display: inline-block; margin: 8px 12px 0; color: #888; text-decoration: none; }
  #back:hover { color: #fff; }
  #app { display: grid; grid-template-columns: 500px minmax(0, 1fr); grid-template-rows: auto 500px auto; gap: 4px; padding: 4px 12px 12px; max-width: 1100px; }
  #status { grid-column: 1 / -1; font: 12px Courier, monospace; white-space: pre; overflow-x: auto; padding: 4px 0; }
  #dradis { width: 100%; max-width: 500px; aspect-ratio: 1; background: #1a1a1a; cursor: crosshair; display: block; }
  #log { margin: 0; overflow-y: auto; background: #101418; color: #c8e6ff; font: 11px/1.35 Courier, monospace; white-space: pre-wrap; padding: 4px 6px; }
  #cmd { grid-column: 1 / -1; font: 13px Courier, monospace; padding: 6px; background: #2a2a2a; color: #fff; border: 1px solid #555; }
  #loading { grid-column: 1 / -1; }
  #modal { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; }
  #modal[hidden] { display: none; }
  #box { background: #ececec; color: #000; max-width: min(600px, 94vw); max-height: 94vh; overflow: auto; border-radius: 6px; box-shadow: 0 8px 30px #000; }
  #bar { display: flex; justify-content: space-between; align-items: center; background: #d4d4d4; padding: 4px 10px; font-weight: 600; font-size: 13px; }
  #modal-close { border: 0; background: none; font-size: 16px; cursor: pointer; }
  #modal-body { padding: 0 12px 12px; }
  #modal-body p { width: 420px; max-width: 100%; font-size: 13pt; white-space: pre-wrap; }
  #modal-body button { display: block; width: 100%; margin: 6px 0; padding: 5px; font: 13px helvetica, arial, sans-serif; }
  #modal-body canvas { display: block; margin-top: 12px; width: 550px; max-width: 100%; cursor: pointer; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto 260px auto; }
  }
</style>
</head>
<body>
<a id="back" href="../">← back</a>
<div id="app">
  <div id="status"></div>
  <div id="loading">Loading…</div>
  <canvas id="dradis" width="500" height="500"></canvas>
  <pre id="log"></pre>
  <input id="cmd" placeholder="Type a command (help, scan, jump X,Y, launch N, …) and press Enter" autofocus autocomplete="off">
</div>
<div id="modal" hidden><div id="box">
  <div id="bar"><span id="modal-title"></span><button id="modal-close" aria-label="Close">✕</button></div>
  <div id="modal-body"></div>
</div></div>
<script src="../../progress.js" data-size="3167993"></script>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(progressFetch("battletrail.wasm"), go.importObject)
    .then(r => go.run(r.instance))
    .catch(e => { document.getElementById("loading").textContent = "Failed to load: " + e; });
</script>
<script src="../../keys.js" data-keys="Type a command + Enter — every game action happens in the command line|Left click on the dradis — dradis click"></script>
</body>
</html>
