  #terminal { font-size: clamp(10px, min(2vw, 3.6vh), 22px); line-height: normal; color: #ccc; }
  /* cells are fractional px wide: bleed each background a hair into the next cell so no seams show (text paints after all

  #terminal span { padding-right: 0.06em; margin-right: -0.06em; }
  #terminal .cell { display: inline-block; width: 1ch; vertical-align: top; text-align: center; overflow: hidden; }

<script>
// Minimal in-memory filesystem for Go's syscall/js (Go embeds data_rx1 and fills it via __fsPut; saves live in memory).
(() => {
  const files = new Map(), dirs = new Set(["/"]), fds = new Map();
  let nextFd = 100, out = "";
  const norm = p => "/" + p.split("/").reduce((a, s) => (s === "..") ? a.slice(0, -1) : (s && s !== ".") ? [...a, s] : a, []).join("/");
  const addDirs = p => { for (let d = p; d !== "/"; ) { d = d.slice(0, d.lastIndexOf("/")) || "/"; dirs.add(d); } };
  const err = c => Object.assign(new Error(c), { code: c });
  const st = p => {
    const isDir = dirs.has(p), f = files.get(p);
    if (!isDir && !f) return null;
    return { dev: 0, ino: 0, mode: isDir ? 0o40755 : 0o100644, nlink: 1, uid: 0, gid: 0, rdev: 0,
      size: f ? f.length : 0, blksize: 4096, blocks: 0, atimeMs: 0, mtimeMs: 0, ctimeMs: 0, isDirectory: () => isDir };
  };
  globalThis.__fsPut = (p, data) => { p = norm(p); files.set(p, data); addDirs(p); };
  globalThis.path = { resolve: (...a) => norm(a.join("/")) };
  globalThis.process = { pid: 1, ppid: 0, cwd: () => "/", chdir() {}, umask: () => 0o22,
    getuid: () => -1, getgid: () => -1, geteuid: () => -1, getegid: () => -1, getgroups() { throw err("ENOSYS"); } };
  const C = { O_WRONLY: 1, O_RDWR: 2, O_CREAT: 64, O_TRUNC: 512, O_APPEND: 1024, O_EXCL: 128, O_DIRECTORY: -1 };
  const write = (fd, buf, off, len, pos) => {
    if (fd === 1 || fd === 2) {
      out += new TextDecoder().decode(buf.subarray(off, off + len));
      const nl = out.lastIndexOf("\n");
      if (nl !== -1) { console.log(out.slice(0, nl)); out = out.slice(nl + 1); }
      return len;
    }
    const h = fds.get(fd); if (!h) throw err("EBADF");
    const at = pos ?? h.pos, old = files.get(h.p), end = Math.max(old.length, at + len);
    const nb = new Uint8Array(end); nb.set(old); nb.set(buf.subarray(off, off + len), at);
    files.set(h.p, nb); if (pos == null) h.pos = at + len;
    return len;
  };
  const ops = {
    constants: C,
    writeSync: (fd, buf) => write(fd, buf, 0, buf.length, null),
    write(fd, buf, off, len, pos, cb) { try { cb(null, write(fd, buf, off, len, pos)); } catch (e) { cb(e); } },
    open(p, flags, mode, cb) {
      p = norm(p);
      if (!st(p)) {
        if (!(flags & C.O_CREAT)) return cb(err("ENOENT"));
        if (!dirs.has(p.slice(0, p.lastIndexOf("/")) || "/")) return cb(err("ENOENT"));
        files.set(p, new Uint8Array(0));
      } else if (flags & C.O_TRUNC && files.has(p)) files.set(p, new Uint8Array(0));
      const fd = nextFd++;
      fds.set(fd, { p, pos: (flags & C.O_APPEND) ? files.get(p)?.length ?? 0 : 0 });
      cb(null, fd);
    },
    close(fd, cb) { fds.delete(fd); cb(null); },
    read(fd, buf, off, len, pos, cb) {
      const h = fds.get(fd), f = h && files.get(h.p); if (!f) return cb(err("EBADF"));
      const at = pos ?? h.pos, n = Math.max(0, Math.min(len, f.length - at));
      buf.set(f.subarray(at, at + n), off); if (pos == null) h.pos = at + n;
      cb(null, n);
    },
    fstat(fd, cb) { const h = fds.get(fd); h ? cb(null, st(h.p)) : cb(err("EBADF")); },
    stat(p, cb) { const s = st(norm(p)); s ? cb(null, s) : cb(err("ENOENT")); },
    lstat(p, cb) { ops.stat(p, cb); },
    readdir(p, cb) {
      p = norm(p); if (!dirs.has(p)) return cb(err("ENOENT"));
      const pre = p === "/" ? "/" : p + "/", names = new Set();
      for (const k of [...files.keys(), ...dirs]) if (k.startsWith(pre) && k !== p) names.add(k.slice(pre.length).split("/")[0]);
      cb(null, [...names]);
    },
    mkdir(p, perm, cb) { p = norm(p); if (st(p)) return cb(err("EEXIST")); dirs.add(p); addDirs(p); cb(null); },
    unlink(p, cb) { files.delete(norm(p)) ? cb(null) : cb(err("ENOENT")); },
    rmdir(p, cb) { dirs.delete(norm(p)) ? cb(null) : cb(err("ENOENT")); },
    rename(a, b, cb) { a = norm(a); b = norm(b); if (!files.has(a)) return cb(err("ENOENT")); files.set(b, files.get(a)); files.delete(a); addDirs(b); cb(null); },
    ftruncate(fd, len, cb) { const h = fds.get(fd); if (!h) return cb(err("EBADF")); files.set(h.p, files.get(h.p).slice(0, len)); cb(null); },
    truncate(p, len, cb) { p = norm(p); if (!files.has(p)) return cb(err("ENOENT")); files.set(p, files.get(p).slice(0, len)); cb(null); },
    fsync(fd, cb) { cb(null); },
    utimes(p, a, m, cb) { cb(null); }, chmod(p, m, cb) { cb(null); }, fchmod(fd, m, cb) { cb(null); },
    chown(p, u, g, cb) { cb(null); }, fchown(fd, u, g, cb) { cb(null); }, lchown(p, u, g, cb) { cb(null); },
    link(a, b, cb) { cb(err("ENOSYS")); }, symlink(a, b, cb) { cb(err("ENOSYS")); }, readlink(p, cb) { cb(err("EINVAL")); },
  };
  globalThis.fs = ops;
})();
</script>

<script>
// tcell.js forwards keys but never stops the browser's own action: F1 opened browser help, F5 reloaded, Tab moved focus.
// Swallow those defaults (the game still gets the key). Ctrl+T etc. are reserved by browsers and can't be caught.
addEventListener("keydown", e => { if (/^F\d+$/.test(e.key) || e.key === "Tab" || e.key === "/") e.preventDefault() }, true)
// Right click (monster stats & lore) never reached the game: browsers fire contextmenu, not click, for button 3.
term.addEventListener("contextmenu", e => {
  e.preventDefault()
  const x = Math.min((e.offsetX / fontwidth) | 0, width-1), y = Math.min((e.offsetY / fontheight) | 0, height-1)
  onMouseClick(x, y, 3, e.shiftKey, e.altKey, e.ctrlKey)
  onMouseClick(x, y, 0, e.shiftKey, e.altKey, e.ctrlKey) // release, so the next right click registers without moving the mouse
})
</script>
<script>
// Block glyphs (U+2588 full, U+2580 upper half, U+2584 lower half) from the font never fill the line box exactly,
// so walls get stripes. Paint them as cell backgrounds instead. tcell looks drawCell up globally on every call.
const drawGlyph = drawCell
// Pin every cell to exactly one column. Glyphs Menlo lacks (e.g. gold "⣴") come from fallback fonts with other
// advances and would shift the rest of the row; boxing only those drifts against plain text, so box them all.
function fixWidth(x, y) {
  let el = content.data[y].data[x]
  if (!el.style) { const span = document.createElement("span"); span.appendChild(el); el = content.data[y].data[x] = span }
  el.classList.add("cell")
}
drawCell = function (x, y, c, comb, fg, bg, attrs) {
  const half = { 0x2580: "bottom", 0x2584: "top" }[c] // gradient direction: the "on" colour starts at the far side
  if (c !== 0x2588 && !half) {
    drawGlyph(x, y, c, comb, fg, bg, attrs)
    return fixWidth(x, y)
  }
  drawGlyph(x, y, 32, comb, fg, bg, attrs)
  const el = content.data[y].data[x]
  if (!el.style || !el.style.color) { drawGlyph(x, y, c, comb, fg, bg, attrs); return fixWidth(x, y) } // default colours: keep the glyph
  const on = el.style.color, off = el.style.backgroundColor || "transparent"
  el.style.background = !half ? on : `linear-gradient(to ${half}, ${on} 50%, ${off} 50%)`
  fixWidth(x, y)
}
</script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(progressFetch("rx1.wasm"), go.importObject)
    .then(r => { document.getElementById("loading").remove(); go.run(r.instance); })
    .catch(e => { document.getElementById("loading").textContent = "Failed to load: " + e; console.error(e); });
</script>
