// Minimal in-memory filesystem for Go's syscall/js (Go embeds data_rx1 and fills it via __fsPut; saves live in memory).

  const write = (fd, buf, off, len, pos) => {
    if (fd === 1 || fd === 2) {
      out += new TextDecoder().decode(buf.subarray(off, off + len));
      const nl = out.lastIndexOf("\n");
      if (nl !== -1) { console.log(out.slice(0, nl)); out = out.slice(nl + 1); }
      return len;
    }

    stat(p, cb) { const s = st(norm(p)); s ? cb(null, s) : cb(err("ENOENT")); },
    lstat(p, cb) { ops.stat(p, cb); },
    readdir(p, cb) {

    },
    mkdir(p, perm, cb) { p = norm(p); if (st(p)) return cb(err("EEXIST")); dirs.add(p); addDirs(p); cb(null); },
    unlink(p, cb) { files.delete(norm(p)) ? cb(null) : cb(err("ENOENT")); },
    rmdir(p, cb) { dirs.delete(norm(p)) ? cb(null) : cb(err("ENOENT")); },
    rename(a, b, cb) { a = norm(a); b = norm(b); if (!files.has(a)) return cb(err("ENOENT")); files.set(b, files.get(a)); files.delete(a); addDirs(b); cb(null); },
    ftruncate(fd, len, cb) { const h = fds.get(fd); if (!h) return cb(err("EBADF")); files.set(h.p, files.get(h.p).slice(0, len)); cb(null); },
    truncate(p, len, cb) { p = norm(p); if (!files.has(p)) return cb(err("ENOENT")); files.set(p, files.get(p).slice(0, len)); cb(null); },
    fsync(fd, cb) { cb(null); },
    utimes(p, a, m, cb) { cb(null); }, chmod(p, m, cb) { cb(null); }, fchmod(fd, m, cb) { cb(null); },
    chown(p, u, g, cb) { cb(null); }, fchown(fd, u, g, cb) { cb(null); }, lchown(p, u, g, cb) { cb(null); },
    link(a, b, cb) { cb(err("ENOSYS")); }, symlink(a, b, cb) { cb(err("ENOSYS")); }, readlink(p, cb) { cb(err("EINVAL")); },
  };

  const keep = p => p.startsWith("/save.rx1") && !p.endsWith(".tmp");
  const idb = new Promise(ok => { const r = indexedDB.open("rx1-saves", 1); r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); });
  const persist = () => idb.then(db => {
    if (!db) return;
    const store = db.transaction("files", "readwrite").objectStore("files");
    store.clear();
    for (const [p, data] of files) if (keep(p)) store.put(data, p);
  }).catch(e => console.warn("save not persisted", e));
  for (const k of ["close", "rename", "unlink"]) { // Go closes the file after writing it, and renames it into place
    const f = ops[k];
    ops[k] = (...a) => { const cb = a.pop(), p = k === "close" ? fds.get(a[0])?.p : norm(a[0]); f(...a, (...r) => { if (p && (keep(p) || k === "rename" && keep(norm(a[1])))) persist(); cb(...r); }); };
  }
  // resolves once the saved files are back in the in-memory fs, before Go starts
  globalThis.__fsRestored = idb.then(db => db && new Promise(ok => { // never blocks the game: no storage just means no saves
    const r = db.transaction("files").objectStore("files").openCursor();
    r.onsuccess = () => { const c = r.result; if (c) { files.set(c.key, c.value); c.continue(); } else ok(); };
    r.onerror = () => ok();
  })).catch(e => console.warn("saves not restored", e));
  globalThis.fs = ops;
})();

<script>
// RVIP-WM windows. Go (startup_js.go) sees rvipPane and sends every side window here instead of drawing it in the
// terminal; the terminal is only the map (fixed grid, see fitMap).
let promptTimer
function rvipPane(name, html, plain) {
  if (name === "prompt") { // a message vanishes after a while, a question waits (gfx/client.go question, promptLife)
    RvipWM.prompt.text(plain); clearTimeout(promptTimer)
    const t = plain.trim()
    if (t && !(t.endsWith("?") || t.endsWith("(y/n)") || t.startsWith("Press ")))
      promptTimer = setTimeout(() => { const n = document.querySelector(".wm-topl"); if (n) n.hidden = true }, 8000)
    return
  }
  if (name === "modal") return // one-window clients only (gfx); here every window is always shown
  if (name === "tiles") { tiles = plain.trim() === "on"; return applyFonts() } // the theme's tiles mode (controller.go setTheme)
  if (name === "showmonster") return plain.trim() && openDetail(+plain)
  if (/^(sheet|lore)\d+$/.test(name)) { info[name] = html; return drawDetail() }
  // inventory open: the last line "@pic <name>" (console.PicMark) names the item's picture: the item is a card over
  // the map (as gfx renderCard), the Visible window keeps its list
  const pic = name === "visible" && plain.match(/\n@pic (\w+)\s*$/)
  if (pic) return showCard(html.replace(/\n[^\n]*@pic [^\n]*$/, ""), pic[1])
  if (name === "visible") { itemCard.hidden = true; visibleHTML = html; drawDetail(); if (images.on) return drawCards() }
  const pre = name === "overlay" ? overlay : document.querySelector(`#t-${name} pre`), body = pre.parentNode
  pre.hidden = name === "overlay" && !html; body.querySelector(".cards")?.remove()
  pre.innerHTML = html
  // one .cell per character, as on the map: the list font's own cell, also for glyphs it lacks or proportional fonts
  const tw = document.createTreeWalker(pre, NodeFilter.SHOW_TEXT), texts = []
  while (tw.nextNode()) texts.push(tw.currentNode)
  for (const t of texts) {
    const f = document.createDocumentFragment()
    for (const ch of t.data) {
      if (ch === "\n") { f.append(ch); continue }
      const c = document.createElement("span"); c.className = "cell"; c.textContent = ch; fitGlyph(c, ch, faceOf(pre)); f.append(c)
    }

  }
  if (name === "messages") body.scrollTop = body.scrollHeight
}
const itemCard = document.createElement("div"); itemCard.id = "itemcard"; itemCard.hidden = true; document.body.append(itemCard)
function showCard(html, pic) {
  const [head, ...rest] = html.split("\n"), m = document.querySelector("#t-map").getBoundingClientRect()
  while (rest.length && !rest[0].replace(/<[^>]*>/g, "").trim()) rest.shift() // the gap under the name is the rule
  itemCard.innerHTML = `<div class="head">${head}</div><div class="plate"><img src="items/${pic}.png" alt="" onerror="this.parentNode.remove()"></div><div class="text">${rest.join("\n")}</div>`
  itemCard.style.fontFamily = document.querySelector("#t-visible pre").style.fontFamily
  Object.assign(itemCard.style, { left: m.left + m.width / 2 + "px", top: m.top + m.height / 2 + "px", maxWidth: m.width * 0.9 + "px", maxHeight: m.height * 0.9 + "px" })
  itemCard.hidden = false
}
// RVIP fixed-size game: every level is 80x23 (config.rec MapWidth/MapHeight), so tcell keeps that one grid and the
// Map window scales its font to fit it whole, aspect kept, centred; no scrolling, no A-/A+.
// Map scroll (top bar) instead: the cells keep their height (scroll.rh px, − / + on the map's title bar) and the
// grid is what fits the window; the game scrolls the map in it (console drawMap).
const COLS = 80, ROWS = 23, scroll = { on: false, rh: 24 }
function fitMap() {
  if (typeof rvipResize !== "function") return
  if (scroll.on) {
    const body = term.parentNode, em = v => parseFloat(term.style.getPropertyValue(v)) || 1
    const px = scroll.rh / em("--rh")
    term.style.fontSize = px + "px"
    return rvipResize(Math.max(1, Math.floor(body.clientWidth / (px * em("--cw")))), Math.max(1, Math.floor(body.clientHeight / scroll.rh)))
  }
  rvipResize(COLS, ROWS)
  requestAnimationFrame(() => { // scale from the drawn grid itself: its cells (1ch, line-height normal) are what must fit
    const body = term.parentNode, w = term.offsetWidth, h = term.offsetHeight
    if (!w || !h) return
    const px = parseFloat(getComputedStyle(term).fontSize) * Math.min(body.clientWidth / w, body.clientHeight / h) * 0.998 // a hair under: subpixel cells must not overflow
    term.style.fontSize = Math.floor(px * 100) / 100 + "px"
